name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps turbo's strict env mode from stripping what the build needs.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Static checks are fast and catch most of what a reviewer would. They run
  # first so a typo never waits behind a database.
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The schema is the product's real contract, so every push proves the whole
  # migration history still applies to an empty database and that the SQL
  # invariants — tenant isolation, billing immutability, invoice numbering —
  # still hold. No Docker or Supabase stack needed: harness.sql stands in for
  # the Supabase-managed schemas.
  database:
    name: Migrations and SQL invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Apply every migration and run the SQL assertions
        run: supabase/test/run.sh

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build inlines NEXT_PUBLIC_* values, so it needs them present. These
      # are placeholders that reach nothing: CI proves the app compiles and
      # renders, while the real values come from the hosting platform.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  # The end-to-end specs that need no backend. They catch a broken bundle, a
  # form that stopped validating, or a layout that overflows a phone — none of
  # which a unit test sees.
  e2e:
    name: End-to-end (unauthenticated surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @reinigung/web exec playwright install --with-deps chromium

      - name: Run the public end-to-end suite
        run: pnpm --filter @reinigung/web test:e2e:public
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
