name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything here is safe on any pull request, including from a fork: no job
# reads a secret, and no job touches a deployed environment. The suites that
# need credentials — the authenticated end-to-end specs, and the Supabase
# integration tests — live in staging-e2e.yml, which runs on request against a
# reviewer-approved environment.
env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Static checks are fast and catch most of what a reviewer would. They run
  # first so a typo never waits behind a database.
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test


  # The schema is the product's real contract, so every push proves the whole
  # migration history still applies to an empty database and that the SQL
  # invariants — tenant isolation, billing immutability, invoice numbering —
  # still hold. No Docker or Supabase stack needed: harness.sql stands in for
  # the Supabase-managed schemas.
  database:
    name: Migrations and SQL invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Reject duplicate migration versions
        run: supabase/test/migration-versions.test.sh

      - name: Apply every migration and run the SQL assertions
        run: supabase/test/run.sh

      # Die CI prueft gegen eine leere Datenbank. Production ist keine leere
      # Datenbank -- dort fehlen einzelne Migrationen, und andere wurden mit
      # abweichenden Zeitstempeln eingespielt. Dieser Schritt beweist, dass
      # der Nachtrag von einem aelteren Stand aus durchlaeuft; welcher Stand
      # das ist, sagt supabase/tools/schema-drift.sh gegen das Ziel.
      - name: Upgrade-Pfad von einem aelteren Stand aus
        run: supabase/tools/upgrade-path.sh tail 20261006000022

      # Der eingecheckte Soll-Stand ist die Grundlage des Drift-Vergleichs
      # gegen Production. Veraltet er, vergleicht man gegen eine Vermutung.
      # Nebeneffekt, der zaehlt: die Rechte stehen darin, also faellt eine
      # versehentlich an `anon` vergebene Funktion hier auf.
      - name: Soll-Stand des Schemas passt zu den Migrationen
        run: supabase/tools/schema-drift.sh verify

      # Eine Sicherung, die nie zurueckgespielt wurde, ist keine Sicherung.
      # Dieser Schritt sichert, spielt in eine getrennte Datenbank zurueck und
      # laesst dort alle Zusicherungen laufen. Beim ersten Lauf hat er einen
      # echten Fehler im Verfahren gefunden: mit `--no-privileges` ist die
      # Wiederherstellung unbrauchbar.
      - name: Wiederherstellung aus einer Sicherung beweisen
        run: supabase/tools/backup-restore.sh drill

  # Die E-Rechnung ist in Deutschland kein Komfortthema, sondern Pflicht. Eine
  # selbst geschriebene Pruefung beweist nur, dass wir unsere eigene Vorstellung
  # einhalten; ob ein Empfaenger das Dokument annimmt, entscheidet der
  # Validator des KoSIT gegen die offiziellen XRechnung-Szenarien. Deshalb
  # laeuft er hier bei jedem Push.
  einvoice:
    name: E-Rechnung gegen den KoSIT-Validator
    runs-on: ubuntu-latest
    env:
      VALIDATOR_VERSION: '1.5.0'
      CONFIG_VERSION: '2024-06-20'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile

      # Die Unit-Tests rendern dabei die Dokumente nach apps/web/.xrechnung/:
      # sample.xml aus dem Code und demo-invoice.xml mit genau den Zahlen, die
      # supabase/seed/demo-for-account.sql in die Datenbank schreibt. So wird
      # geprueft, was der Code wirklich erzeugt, und kein von Hand gepflegtes
      # Abbild — und auch die Rechnung, mit der getestet wird.
      - name: Rechnungen erzeugen
        run: |
          set -euo pipefail
          # Beide Syntaxen der EN 16931: UBL fuer die XRechnung, CII fuer
          # ZUGFeRD/Factur-X. Dieselben Zahlen, zwei Formate -- und beide
          # werden unten vom Validator geprueft, nicht nur eines.
          pnpm --filter @reinigung/web exec vitest run tests/xrechnung.test.ts tests/cii.test.ts tests/zugferd.test.ts

      # Das XML, das unten geprueft wird, kommt aus der fertigen PDF-Datei und
      # nicht aus dem Generator. Dazwischen liegt das Einbetten -- genau dort
      # koennte etwas verloren gehen, ohne dass ein Test am Generator es
      # bemerkt.
      - name: CII-XML aus der ZUGFeRD-Rechnung holen
        run: node tools/extract-factur-x.mjs apps/web/.xrechnung/zugferd-invoice.pdf apps/web/.xrechnung/embedded-cii.xml

      # PDF/A-3B ist keine Formsache: ohne sie ist die Datei kein gueltiges
      # ZUGFeRD, egal wie gut das XML ist. Geprueft wird mit veraPDF, nicht
      # mit eigenen Zusicherungen.
      - name: PDF/A-3B mit veraPDF pruefen
        run: |
          set -euo pipefail
          tools/verapdf.sh \
            apps/web/.xrechnung/plain-invoice.pdf \
            apps/web/.xrechnung/zugferd-invoice.pdf

      - name: KoSIT-Validator und XRechnung-Szenarien laden
        run: |
          set -euo pipefail
          mkdir -p .kosit/scenarios
          curl -fsSL -o .kosit/validator.zip \
            "https://github.com/itplr-kosit/validator/releases/download/v${VALIDATOR_VERSION}/validator-${VALIDATOR_VERSION}-distribution.zip"
          unzip -q .kosit/validator.zip -d .kosit
          curl -fsSL -o .kosit/scenarios.zip \
            "https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/release-${CONFIG_VERSION}/validator-configuration-xrechnung_3.0.2_${CONFIG_VERSION}.zip"
          unzip -q .kosit/scenarios.zip -d .kosit/scenarios

      - name: Rechnung pruefen
        run: |
          set -euo pipefail
          java -jar .kosit/validationtool-${VALIDATOR_VERSION}-standalone.jar \
            -s .kosit/scenarios/scenarios.xml \
            -r .kosit/scenarios \
            -h -o .kosit/report \
            apps/web/.xrechnung/sample.xml \
            apps/web/.xrechnung/demo-invoice.xml \
            apps/web/.xrechnung/sample-cii.xml \
            apps/web/.xrechnung/demo-invoice-cii.xml \
            apps/web/.xrechnung/embedded-cii.xml
          # Der Validator beendet sich bei einer Ablehnung mit Code 1,
          # `set -e` faengt das also schon. Nachgemessen mit Version 1.5.0:
          # abgelehnt -> 1, angenommen -> 0.
          #
          # Die folgende Pruefung ist die zweite Leitung, und sie sucht nach
          # `rep:reject` -- so heisst das Element im Bericht wirklich. Die
          # frueher hier gesuchte Zeichenkette `<accepted>false</accepted>`
          # kommt in keinem Bericht vor; sie haette eine Ablehnung nie
          # gefunden. Nachgemessen an einem Dokument ohne Leitweg-ID:
          # 1 Rejected, und null Treffer fuer die alte Zeichenkette.
          if grep -q "rep:reject" .kosit/report/*.xml; then
            echo "::error::Eine erzeugte E-Rechnung wurde vom KoSIT-Validator abgelehnt."
            exit 1
          fi
          # Fuenf Eingabedateien muessen fuenf Berichte ergeben. Ohne diese
          # Zeile waere der Job auch gruen, wenn eine Datei nie geprueft
          # wurde -- etwa weil der Validator kein passendes Szenario fand.
          reports=$(ls .kosit/report/*.xml | wc -l)
          if [ "$reports" -lt 5 ]; then
            echo "::error::Es wurden nur $reports Rechnungen geprueft, erwartet sind 5."
            exit 1
          fi
          echo "E-Rechnung akzeptiert: $reports Dokumente, UBL und CII."

      - name: Report aufbewahren, wenn etwas schiefging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kosit-report
          path: .kosit/report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build inlines NEXT_PUBLIC_* values, so it needs them present. These
      # are placeholders that reach nothing: CI proves the app compiles and
      # renders, while the real values come from the hosting platform.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  # The end-to-end specs that need no backend. They catch a broken bundle, a
  # form that stopped validating, or a layout that overflows a phone — none of
  # which a unit test sees.
  e2e:
    name: End-to-end (unauthenticated surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @reinigung/web exec playwright install --with-deps chromium

      - name: Run the public end-to-end suite
        run: pnpm --filter @reinigung/web test:e2e:public
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential

      # Run the optional widget tests with a mocked provider, never real keys.
      - name: Run CAPTCHA lifecycle tests
        run: pnpm --filter @reinigung/web exec playwright test e2e/public/auth-captcha.spec.ts
        env:
          E2E_CAPTCHA_SITE_KEY: e2e-site-key
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential

      # Die Warteschlange der Mitarbeiter-App gegen die IndexedDB von Chromium
      # statt gegen fake-indexeddb. Der Unterschied ist nicht theoretisch:
      # eine offene Verbindung blockiert `deleteDatabase`, und zwei Laschen,
      # die sich eine Datenbank teilen, gibt es nur in einem echten Browser.
      # Diese Suite braucht kein Backend und keinen Build.
      - name: Offline-Warteschlange im echten Browser
        run: pnpm --filter @reinigung/web test:e2e:offline

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Die angemeldete Oberflaeche, gegen ein echtes Supabase.
  #
  # Warum hier und nicht in staging-e2e.yml: jenes laeuft bewusst nicht auf
  # push, und die Begruendung dort ist richtig -- ein gehostetes Staging
  # braucht Secrets, die kein Fork bekommen darf, und zwei gleichzeitige
  # Laeufe schreiben in denselben Mandanten. Beides faellt weg, wenn das
  # Supabase-Projekt *pro Lauf* entsteht und danach weggeworfen wird: die
  # Zugangsdaten stehen im Seed im Repository, sind also keine Geheimnisse,
  # und jeder Lauf hat seine eigene Datenbank. Damit laeuft die Suite auf
  # jedem Push, auch aus einem Fork.
  #
  # staging-e2e.yml bleibt daneben bestehen und behaelt seinen Zweck: ein
  # gehostetes Staging prueft, was eine lokale Instanz nicht zeigt -- die
  # echte Hosting-Umgebung, ihre Umgebungsvariablen und ihr Netz.
  authenticated-e2e:
    name: Authenticated end-to-end (disposable Supabase)
    runs-on: ubuntu-latest
    # Migrationen anwenden, Stack hochfahren, bauen und 154 Testlaeufe mit
    # einem Worker: das dauert. Die Grenze soll einen haengenden Lauf beenden,
    # nicht einen langsamen.
    #
    # Bewusst nicht je Projekt aufgeteilt, obwohl das die Wartezeit halbieren
    # wuerde: die Pruefung unten verlangt, dass *jede* Spec-Datei einen Test
    # ausgefuehrt hat, und das gilt nur ueber alle Breiten zusammen --
    # field-app laeuft nur auf dem Telefon, office nur am Schreibtisch. Zwei
    # getrennte Laeufe wuerden jeder fuer sich reihenweise leere Dateien
    # melden. Die Aussagekraft der Pruefung ist mehr wert als die halbe
    # Wartezeit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      # Die CLI-Version ist im Repository festgelegt (devDependency `supabase`),
      # darum `pnpm exec` und nicht `npx`: sonst holt der Lauf irgendeine
      # neuere und die Umgebung aendert sich, ohne dass jemand etwas commitet.
      - name: Start a throwaway Supabase stack
        run: pnpm exec supabase start

      # API-Adresse, Schluessel und Datenbank kommen aus dem gerade
      # gestarteten Stack. Nichts davon ist eingetragen: die Schluessel eines
      # lokalen Stacks sind bei jeder CLI-Version andere.
      - name: Read the stack's addresses
        id: stack
        run: |
          set -euo pipefail
          status="$(pnpm exec supabase status -o json)"
          for key in API_URL ANON_KEY DB_URL; do
            value="$(printf '%s' "$status" | jq -r ".$key // empty")"
            if [ -z "$value" ]; then
              echo "::error::supabase status lieferte kein $key."
              printf '%s\n' "$status"
              exit 1
            fi
            # ANON_KEY ist der Schluessel eines Wegwerf-Stacks und kein
            # Geheimnis, wird aber trotzdem maskiert: er soll nicht in
            # Protokollen stehen, die jemand spaeter fuer echte halten koennte.
            if [ "$key" = "ANON_KEY" ]; then echo "::add-mask::$value"; fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      # Ohne Daten ueberspringen sich die meisten Specs ("no job assigned to
      # this employee in this environment") und der Lauf waere gruen, ohne
      # etwas geprueft zu haben. Der Seed legt einen vollstaendigen Mandanten
      # an: zugewiesene Einsaetze mit erfasster Zeit, eine Beschwerde, ein
      # Portalkontakt und drei Rechnungen in drei Zustaenden.
      #
      # Er weigert sich, in eine Datenbank zu schreiben, die schon einen
      # echten Mandanten enthaelt -- hier ist sie Sekunden alt und leer.
      - name: Seed the demo tenant
        env:
          DB_URL: ${{ steps.stack.outputs.DB_URL }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -c "set sauberwerk.seed_confirmed = 'local-development'" \
            -f supabase/seed/demo.sql

      - name: Install the Playwright browser
        run: pnpm --filter @reinigung/web exec playwright install --with-deps chromium

      - name: Run the authenticated suite
        id: suite
        env:
          # Kein E2E_BASE_URL: Playwright baut und bedient die Anwendung
          # selbst auf 3100, gegen diesen Stack. Ein von aussen gesetztes
          # Ziel waere hier falsch -- es gehoert nach staging-e2e.yml.
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.stack.outputs.ANON_KEY }}
          # Die vier Konten aus supabase/seed/demo.sql. Sie stehen offen im
          # Repository, weil sie nur in dieser Wegwerf-Datenbank existieren.
          E2E_OWNER_EMAIL: inhaber@demo.test
          E2E_OWNER_PASSWORD: DemoPasswort2026!
          E2E_EMPLOYEE_EMAIL: mitarbeiter@demo.test
          E2E_EMPLOYEE_PASSWORD: DemoPasswort2026!
          E2E_CUSTOMER_EMAIL: kunde@demo.test
          E2E_CUSTOMER_PASSWORD: DemoPasswort2026!
          E2E_RUN_ID: gh-${{ github.run_id }}
          # THROTTLE_SIGNING_SECRET bleibt absichtlich leer. Mit Schluessel
          # zaehlt die Anmeldebremse je Adresse: 10 Versuche in 10 Minuten --
          # und in CI kommt die ganze Suite aus einer Adresse. Ohne ihn gilt
          # `login:shared` mit 600 in 600 Sekunden, was fuer diesen Lauf
          # reicht. Was der Schluessel bewirkt, prueft
          # supabase/test/auth-throttle-hardening.test.sql.
          #
          # E2E_ALLOW_PRODUCTION wird nie gesetzt. Die Suite weigert sich
          # gegen ein Ziel, das wie Produktion aussieht oder sich selbst so
          # meldet, und diese Weigerung darf aus CI nicht aushebelbar sein.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/apps/web/playwright-report.json
        run: pnpm --filter @reinigung/web exec playwright test e2e/authenticated/zz-probe.spec.ts --retries=0 --reporter=list,json

      # Playwright beendet sich mit 0, wenn sich jeder Test uebersprungen hat.
      # Nachgemessen: ohne Zugangsdaten 154 uebersprungen, 0 ausgefuehrt,
      # Exit 0. Das ist kein gruener Lauf, sondern eine fehlende
      # Voraussetzung, und genau diese Verwechslung faengt der Schritt hier.
      #
      # `always()`: er muss auch dann urteilen, wenn der Lauf schon rot ist --
      # ein roter Lauf, in dem nebenbei eine ganze Spec-Datei nie zum Zuge
      # kam, hat zwei Befunde und nicht einen.
      # `always()`, damit er auch bei rotem Lauf urteilt: ein roter Lauf, in
      # dem nebenbei eine ganze Spec-Datei nie zum Zuge kam, hat zwei Befunde
      # und nicht einen. Aber nur, wenn der Lauf ueberhaupt stattgefunden hat
      # -- sonst waere "kein Bericht lesbar" eine zweite Meldung ueber einen
      # Fehler, der schon weiter oben steht.
      - name: Die Suite muss wirklich gelaufen sein
        if: always() && steps.suite.outcome != 'skipped'
        run: node tools/check-e2e-coverage.mjs apps/web/playwright-report.json

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report.json
          retention-days: 14

      # Auch nach einem Fehlschlag: der Stack haelt Container und Volumes.
      - name: Stop the stack
        if: always()
        run: pnpm exec supabase stop --no-backup
