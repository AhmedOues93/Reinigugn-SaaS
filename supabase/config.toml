project_id = "reinigungsfirma-saas-claude"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Pinned explicitly rather than left to the CLI's own default template: that
# default is `https://127.0.0.1:3000` (note the scheme), which matches neither
# the app's actual `http://127.0.0.1:3000` origin nor a redirect built from
# NEXT_PUBLIC_SITE_URL that disagreed with it — the mismatch made
# `signUp`'s `emailRedirectTo` and `resetPasswordForEmail`'s `redirectTo`
# silently rejected by GoTrue's allow-list. Keep this in step with
# `apps/web/.env.local`'s `NEXT_PUBLIC_SITE_URL` and with whatever port
# `next dev` actually runs on.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true

# Zwei-Faktor fuer die Buero-Konten. Lokal eingeschaltet, damit die
# Einrichtung getestet werden kann, ohne sie erst im Dashboard zu suchen.
# In einem gehosteten Projekt steht derselbe Schalter unter
# Authentication -> Multi-Factor Authentication; ohne ihn antwortet
# `mfa.enroll` mit "MFA is not enabled".
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Mailpit: web UI on 54324. The SMTP port is exposed so the app's invoice e-mail
# can be pointed at it locally (SMTP_HOST=127.0.0.1, SMTP_PORT=54325). Takes
# effect after `supabase stop && supabase start`.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
